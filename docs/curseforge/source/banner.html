<!doctype html>
<html><head><meta charset="utf-8"><title>SoulDex banner</title>
<link rel="stylesheet" href="shared.css">
<style>
	/* Header image for the top of the project description, 1200x400.
	   A centred lockup only: the feature images carry the UI. */
	.banner {
		position: relative; width: 1200px; height: 400px; overflow: hidden;
		background:
			radial-gradient(ellipse 38% 75% at 50% 46%, #4a2384 0%, #241238 45%, transparent 80%),
			linear-gradient(180deg, #0d0915 0%, #0b0811 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
	}
	/* faint star dust, fading out towards the edges */
	.banner::before {
		content: ""; position: absolute; inset: 0;
		background-image: radial-gradient(#ffffff26 1px, transparent 1.4px); background-size: 36px 36px; opacity: .4;
		mask-image: radial-gradient(ellipse 50% 70% at 50% 50%, #000 0%, transparent 75%);
	}
	/* edge vignette */
	.banner::after {
		content: ""; position: absolute; inset: 0; pointer-events: none;
		background: radial-gradient(ellipse 75% 120% at 50% 50%, transparent 55%, #05030a 100%);
	}
	/* large arcane rings behind the lockup, echoing the mark */
	.rings { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1100px; height: 1100px; opacity: .55; }
	.rings circle { fill: none; }

	.lockup { position: relative; z-index: 1; display: flex; align-items: center; gap: 22px; margin-top: -6px; }
	.lockup .mark { width: 150px; height: 150px; filter: drop-shadow(0 0 22px #9a4ae6aa); }
	.lockup h1 {
		font-size: 112px; line-height: 1; letter-spacing: -1px; color: #f4ebff;
		text-shadow: 0 0 30px #8a3cd6aa, 0 4px 0 #22093f;
	}
	.lockup h1 span { color: #c9a8ff; }

	.rule { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; margin: 18px 0 16px; }
	.rule i { display: block; width: 150px; height: 1px; }
	.rule i:first-child { background: linear-gradient(90deg, transparent, #8a5cd0); }
	.rule i:last-child { background: linear-gradient(90deg, #8a5cd0, transparent); }
	.rule b { color: #c9a8ff; font-size: 11px; line-height: 1; }

	.tag { position: relative; z-index: 1; color: #d9cdee; font-size: 30px; font-style: italic; letter-spacing: .3px; }
	.meta { position: relative; z-index: 1; color: #8a72b8; font-size: 15px; letter-spacing: 5px; text-transform: uppercase; margin-top: 14px; }
</style></head>
<body>
	<div class="banner">
		<svg class="rings" viewBox="0 0 1100 1100" aria-hidden="true">
			<circle cx="550" cy="550" r="250" stroke="#6b4fa0" stroke-width="1" opacity=".55"/>
			<circle cx="550" cy="550" r="268" stroke="#6b4fa0" stroke-width="1" stroke-dasharray="2 9" opacity=".7"/>
			<circle cx="550" cy="550" r="380" stroke="#4b2f80" stroke-width="1" opacity=".5"/>
			<circle cx="550" cy="550" r="520" stroke="#3d2668" stroke-width="1" stroke-dasharray="3 12" opacity=".5"/>
		</svg>
		<div class="lockup">
			<img class="mark" src="shard.svg" alt="">
			<h1>Soul<span>Dex</span></h1>
		</div>
		<div class="rule"><i></i><b>◆</b><i></i></div>
		<div class="tag">Every Soul Shard remembers whose soul it holds.</div>
		<div class="meta">A warlock addon for WoW: Forever</div>
	</div>
</body></html>
