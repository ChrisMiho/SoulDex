<!doctype html>
<html><head><meta charset="utf-8"><title>SoulDex banner</title>
<link rel="stylesheet" href="shared.css">
<style>
	/* Header image for the top of the project description, 1200x400. */
	.banner {
		position: relative; width: 1200px; height: 400px; overflow: hidden;
		background: radial-gradient(ellipse 55% 90% at 22% 50%, #44207a 0%, #1c1030 50%, #0b0811 85%);
		display: flex; align-items: center; padding: 0 40px; gap: 28px;
	}
	.banner::before {
		content: ""; position: absolute; inset: 0;
		background-image: radial-gradient(#ffffff22 1px, transparent 1.4px); background-size: 40px 40px; opacity: .35;
		mask-image: radial-gradient(ellipse at 25% 50%, #000 0%, transparent 70%);
	}
	.banner .mark { width: 240px; height: 240px; flex-shrink: 0; position: relative; filter: drop-shadow(0 0 28px #9a4ae688); }
	.banner .text { position: relative; width: 400px; flex-shrink: 0; }
	.banner h1 { font-size: 92px; color: #f1e6ff; line-height: 1; text-shadow: 0 0 26px #8a3cd6, 0 4px 0 #2a0c4a; }
	.banner h1 span { color: #c9a8ff; }
	.banner .tag { color: #c9bde0; font-size: 26px; margin-top: 14px; line-height: 1.3; }
	.banner .meta { color: #8a72b8; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; margin-top: 18px; }
	.banner .side { position: relative; flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-end; }
	.banner .toast { zoom: 1.2; }
	.banner .tt { zoom: 1.2; margin-right: 24px; }
</style></head>
<body>
	<div class="banner">
		<img class="mark" src="shard.svg" alt="">
		<div class="text">
			<h1>Soul<span>Dex</span></h1>
			<div class="tag">Every Soul Shard remembers whose soul it holds.</div>
			<div class="meta">Warlock addon · WoW: Forever</div>
		</div>
		<div class="side">
			<div class="toast">
				<div class="ic"></div>
				<div>
					<div class="t">NEW SOUL CAUGHT!</div>
					<div class="nm" style="color:#ffd25a">Hogger <span style="font-size:10px">Elite</span></div>
					<div class="sub">Elwynn Forest · Soul #42 · <span style="color:#7dff6a">+5 pts</span></div>
				</div>
			</div>
			<div class="tt" style="width:180px">
				<div class="q">Soul Shard</div>
				<div>Unique</div>
				<div style="margin-top:3px">Soul of <span style="color:#ff9a5a">Ragnaros</span></div>
				<div style="color:#9a8fb0;font-size:10px">Molten Core · 12 Nov 2026</div>
			</div>
		</div>
	</div>
</body></html>
