<!doctype html>
<html><head><meta charset="utf-8"><title>SoulDex banner</title>
<link rel="stylesheet" href="shared.css">
<style>
	/* Header image for the top of the project description, 1200x400.
	   A centred lockup only: the feature images carry the UI. */
	.banner {
		position: relative; width: 1200px; height: 400px; overflow: hidden;
		background:
			radial-gradient(ellipse 34% 74% at 50% 44%, #2c1058 0%, #120824 46%, transparent 80%),
			radial-gradient(ellipse 75% 34% at 50% 116%, #46b016aa 0%, #1c4a0a55 45%, transparent 75%),
			linear-gradient(180deg, #09060f 0%, #030205 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
	}
	/* the summoning circle, far bigger than the banner */
	.banner::before {
		content: ""; position: absolute; left: 50%; top: 50%; width: 1060px; height: 1060px;
		transform: translate(-50%, -50%);
		background: url("sigil.svg") center / contain no-repeat; opacity: .36;
	}
	.banner::after {
		content: ""; position: absolute; inset: 0; pointer-events: none;
		background: radial-gradient(ellipse 70% 120% at 50% 50%, transparent 42%, #000000ee 100%);
	}
	.frame { inset: 14px; }
	.embers { transform: translate(-40px, -330px); }

	.kick { position: relative; z-index: 2; font-family: "Cinzel", serif; font-weight: 700; font-size: 15px; letter-spacing: 9px; color: var(--purple-hi); text-transform: uppercase; margin-bottom: 10px; padding-left: 9px; }
	.kick b { color: var(--fel); font-weight: 700; padding: 0 6px; text-shadow: 0 0 10px #8dff3a; }
	.lockup { position: relative; z-index: 2; display: flex; align-items: center; gap: 26px; }
	.lockup .mark { width: 190px; height: 190px; margin: -14px 0 -8px; filter: drop-shadow(0 0 24px #5a22b0aa); }
	.lockup h1 {
		font-family: "Cinzel", serif; font-weight: 900; font-size: 118px; line-height: 1; letter-spacing: 2px; text-transform: uppercase;
		filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 30px #7b3fe480);
	}
	.lockup h1 span { font-size: .78em; }
	.rule { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; margin: 12px 0 12px; }
	.rule i { display: block; width: 190px; height: 1px; }
	.rule i:first-child { background: linear-gradient(90deg, transparent, #6fd62c); }
	.rule i:last-child { background: linear-gradient(90deg, #6fd62c, transparent); }
	.rule b { width: 9px; height: 9px; transform: rotate(45deg); background: var(--fel); box-shadow: 0 0 12px #8dff3a; }
	.tag { position: relative; z-index: 2; font-family: "Cinzel", serif; font-weight: 700; font-size: 27px; letter-spacing: 6px; text-transform: uppercase; padding-left: 8px; filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 16px #6fd62c88); }
	.meta { position: relative; z-index: 2; color: var(--muted); font-size: 17px; letter-spacing: 1px; margin-top: 12px; }
</style></head>
<body>
	<div class="banner">
		<div class="frame"></div><div class="embers"></div>
		<div class="kick">Hunt<b>&#9670;</b>Drain<b>&#9670;</b>Claim</div>
		<div class="lockup">
			<img class="mark" src="shard.svg" alt="">
			<h1 class="steel">S<span>oul</span>D<span>ex</span></h1>
		</div>
		<div class="rule"><i></i><b></b><i></i></div>
		<div class="tag felfire">Their souls. Your collection.</div>
		<div class="meta">A warlock addon for WoW: Forever</div>
	</div>
</body></html>
