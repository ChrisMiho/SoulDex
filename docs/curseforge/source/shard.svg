			<path d="M77.6 57.7 L77.1 54.2 L75.8 49.2 L71.1 46.6 L71.0 41.1 L67.9 46.8 L59.4 45.7 M70.5 100.4 L61.0 101.7 L52.3 97.2 L45.0 94.5 L38.8 97.0 M87.4 137.1 L83.0 137.6 L77.0 135.6 L72.5 136.4 L67.9 141.0 M100.5 165.7 L97.6 166.7 L93.6 168.5 L88.2 165.8 L84.1 164.3 M101.7 45.7 L108.3 45.7 L114.8 48.6 L123.8 50.4 L132.2 48.1 L138.2 43.8 M128.1 87.3 L134.1 80.5 L143.2 78.2 L149.2 77.7 L158.2 78.6 L161.4 83.8 M124.8 127.6 L127.7 132.7 L133.5 134.5 L136.5 139.0 L140.9 144.1 M122.2 158.9 L124.3 153.6 L129.1 154.8 L131.5 157.8 L132.0 161.0 L131.1 165.5 L135.4 165.2" stroke="#f6ffe8" stroke-width="1.0"/>
