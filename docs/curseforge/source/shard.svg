<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
	<!-- SoulDex emblem: a soul shard crackling with fel energy, held in a spiked ring of
	     black iron. Original art. -->
	<defs>
		<radialGradient id="glow" cx="50%" cy="55%" r="50%">
			<stop offset="0%" stop-color="#6fe02a" stop-opacity="0.30"/>
			<stop offset="55%" stop-color="#4a1a8f" stop-opacity="0.22"/>
			<stop offset="100%" stop-color="#12061f" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="disc" cx="50%" cy="45%" r="60%">
			<stop offset="0%" stop-color="#241043"/>
			<stop offset="60%" stop-color="#0e0619"/>
			<stop offset="100%" stop-color="#040208"/>
		</radialGradient>
		<linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#8f84a6"/>
			<stop offset="28%" stop-color="#332b42"/>
			<stop offset="65%" stop-color="#0d0a13"/>
			<stop offset="100%" stop-color="#3a3149"/>
		</linearGradient>
		<linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#eedcff"/>
			<stop offset="38%" stop-color="#a468f5"/>
			<stop offset="100%" stop-color="#3a1080"/>
		</linearGradient>
		<linearGradient id="faceR" x1="1" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#7a3bd6"/>
			<stop offset="55%" stop-color="#3d1282"/>
			<stop offset="100%" stop-color="#12042a"/>
		</linearGradient>
		<linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#d8cdea" stop-opacity="0.9"/>
			<stop offset="45%" stop-color="#d8cdea" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="rimDark" x1="0" y1="0" x2="1" y2="1">
			<stop offset="55%" stop-color="#000" stop-opacity="0"/>
			<stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
		</linearGradient>
		<radialGradient id="well" cx="50%" cy="50%" r="50%">
			<stop offset="62%" stop-color="#000" stop-opacity="0"/>
			<stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
		</radialGradient>
		<linearGradient id="felEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#b6ff7a" stop-opacity="0"/>
			<stop offset="60%" stop-color="#b6ff7a" stop-opacity="0.9"/>
			<stop offset="100%" stop-color="#b6ff7a" stop-opacity="0.2"/>
		</linearGradient>
		<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3.2"/>
		</filter>
		<clipPath id="inside"><circle cx="100" cy="100" r="80"/></clipPath>
		<filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="7"/>
		</filter>
		<!-- one spike on the ring, pointing out (drawn at the bottom) -->
		<path id="spike" d="M90 181 L100 201 L110 181 Z"/>
	</defs>

	<circle cx="100" cy="100" r="99" fill="url(#glow)"/>

	<!-- the ring -->
	<g transform="translate(100 100) scale(0.93) translate(-100 -100)">
		<g fill="url(#iron)" stroke="#000" stroke-width="1.5" stroke-linejoin="round">
			<use href="#spike"/>
			<use href="#spike" transform="rotate(48 100 100)"/>
			<use href="#spike" transform="rotate(-48 100 100)"/>
			<use href="#spike" transform="rotate(90 100 100)"/>
			<use href="#spike" transform="rotate(-90 100 100)"/>
		</g>
		<circle cx="100" cy="100" r="86" fill="url(#disc)"/>
		<!-- iron band: black keyline, bevelled metal, a lit upper-left edge and a shadowed lower-right -->
		<circle cx="100" cy="100" r="86" fill="none" stroke="#000" stroke-width="13"/>
		<circle cx="100" cy="100" r="86" fill="none" stroke="url(#iron)" stroke-width="9.5"/>
		<circle cx="100" cy="100" r="89.4" fill="none" stroke="url(#rimLight)" stroke-width="1.6"/>
		<circle cx="100" cy="100" r="86" fill="none" stroke="#000" stroke-width="0.8" opacity="0.55"/>
		<circle cx="100" cy="100" r="82.4" fill="none" stroke="url(#rimDark)" stroke-width="1.8"/>
		<!-- rivets -->
		<g id="rivets">
			<g id="rivet"><circle cx="100" cy="14" r="2.3" fill="#15111d" stroke="#000" stroke-width="0.6"/><circle cx="99.4" cy="13.4" r="0.9" fill="#a79bc0"/></g>
			<use href="#rivet" transform="rotate(45 100 100)"/><use href="#rivet" transform="rotate(90 100 100)"/>
			<use href="#rivet" transform="rotate(135 100 100)"/><use href="#rivet" transform="rotate(180 100 100)"/>
			<use href="#rivet" transform="rotate(225 100 100)"/><use href="#rivet" transform="rotate(270 100 100)"/>
			<use href="#rivet" transform="rotate(315 100 100)"/>
		</g>
		<!-- the energy lights the inside edge of the band -->
		<circle cx="100" cy="100" r="80.4" fill="none" stroke="#8dff3a" stroke-width="3" opacity="0.35" filter="url(#soft)"/>
		<circle cx="100" cy="100" r="80.6" fill="none" stroke="#b6ff7a" stroke-width="0.7" opacity="0.7"/>
		<!-- depth: the disc darkens towards the band -->
		<circle cx="100" cy="100" r="80" fill="url(#well)"/>

		<!-- fel energy crackling off the shard: forked bolts (generated, then fixed here) with a
		     glow and a white core, thinner towards their ends -->
		<ellipse cx="100" cy="100" rx="42" ry="64" fill="#8dff3a" opacity="0.18" filter="url(#softer)"/>
		<g clip-path="url(#inside)" fill="none" stroke-linecap="round" stroke-linejoin="miter">
