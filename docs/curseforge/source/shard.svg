			<path d="M59.4 45.7 L54.1 41.8 L47.1 41.3 M67.9 46.8 L64.8 43.4 L64.7 37.4 L68.9 33.4 L70.8 28.2 M38.8 97.0 L32.0 95.3 L26.1 94.4 L24.4 89.4 L22.5 84.9 M52.3 97.2 L53.2 92.6 L49.9 89.5 L49.1 83.3 L44.4 78.9 M67.9 141.0 L62.7 147.4 L55.5 148.0 L49.8 150.7 L41.2 152.8 M72.5 136.4 L68.4 142.1 L69.1 150.0 L71.3 156.2 L70.5 166.2 M84.1 164.3 L82.3 168.2 L85.8 170.9 L84.1 175.0 L81.5 176.8 M138.2 43.8 L144.8 45.1 L148.8 42.3 L153.5 41.9 M114.8 48.6 L120.6 46.9 L126.8 45.4 L130.9 47.4 L138.4 47.5 M161.4 83.8 L166.7 86.6 L172.5 88.5 L178.3 89.4 M143.2 78.2 L148.1 71.2 L150.9 64.1 L152.5 58.7 L156.7 53.5 M140.9 144.1 L144.7 140.6 L151.0 140.4 L158.9 143.5 L167.1 141.7 M133.5 134.5 L131.1 138.8 L132.3 144.8 L133.3 152.2 L138.6 156.1 M135.4 165.2 L136.3 170.4 L132.6 171.9 M129.1 154.8 L132.4 158.4 L136.7 159.9 L142.0 161.9 L146.0 160.8" stroke="#f6ffe8" stroke-width="0.5"/>
		</g>
		<g fill="#8dff3a" opacity="0.7" filter="url(#soft)"><circle cx="47.1" cy="41.3" r="3.9"/><circle cx="70.8" cy="28.2" r="3.6"/><circle cx="22.5" cy="84.9" r="3.4"/><circle cx="44.4" cy="78.9" r="3.5"/><circle cx="41.2" cy="152.8" r="4.0"/><circle cx="70.5" cy="166.2" r="3.7"/><circle cx="81.5" cy="176.8" r="3.3"/><circle cx="153.5" cy="41.9" r="4.2"/><circle cx="138.4" cy="47.5" r="3.9"/><circle cx="178.3" cy="89.4" r="4.5"/><circle cx="156.7" cy="53.5" r="3.8"/><circle cx="167.1" cy="141.7" r="3.9"/><circle cx="138.6" cy="156.1" r="3.6"/><circle cx="132.6" cy="171.9" r="3.9"/><circle cx="146.0" cy="160.8" r="4.4"/></g>
		<g fill="#f6ffe8"><circle cx="47.1" cy="41.3" r="0.7"/><circle cx="70.8" cy="28.2" r="0.8"/><circle cx="22.5" cy="84.9" r="1.0"/><circle cx="44.4" cy="78.9" r="1.0"/><circle cx="41.2" cy="152.8" r="0.6"/><circle cx="70.5" cy="166.2" r="0.8"/><circle cx="81.5" cy="176.8" r="1.0"/><circle cx="153.5" cy="41.9" r="1.0"/><circle cx="138.4" cy="47.5" r="0.9"/><circle cx="178.3" cy="89.4" r="0.7"/><circle cx="156.7" cy="53.5" r="0.8"/><circle cx="167.1" cy="141.7" r="0.6"/><circle cx="138.6" cy="156.1" r="0.8"/><circle cx="132.6" cy="171.9" r="0.8"/><circle cx="146.0" cy="160.8" r="1.0"/></g>

		<!-- the shard -->
		<g transform="translate(100 100) rotate(-10) translate(-100 -100)">
			<path d="M100 24 L131 88 L109 172 L100 178 Z" fill="url(#faceR)"/>
			<path d="M100 24 L69 88 L91 172 L100 178 Z" fill="url(#faceL)"/>
			<path d="M100 24 L69 88 L100 102 L131 88 Z" fill="#e3c8ff" opacity="0.5"/>
			<path d="M69 88 L100 102 L131 88" fill="none" stroke="#fbf2ff" stroke-width="1.6" opacity="0.85"/>
			<path d="M100 102 L100 178" stroke="#fbf2ff" stroke-width="1.1" opacity="0.45"/>
			<path d="M100 24 L131 88 L109 172 L100 178 L91 172 L69 88 Z" fill="none" stroke="#080112" stroke-width="2.6" stroke-linejoin="round"/>
			<path d="M100 24 L69 88" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
			<!-- the energy catches the lower edges -->
			<path d="M70.5 90 L91.6 171" stroke="url(#felEdge)" stroke-width="1.5" stroke-linecap="round"/>
			<path d="M129.5 90 L108.4 171" stroke="url(#felEdge)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
			<!-- a soft sheen on the upper facet -->
			<ellipse cx="88" cy="62" rx="5" ry="11" fill="#ffffff" opacity="0.4" filter="url(#soft)" transform="rotate(26 88 62)"/>
		</g>
		<!-- thin arcs jumping across the face of the shard -->
		<g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
			<path d="M72.9 74.0 L82.6 72.4 L96.4 76.8 L108.3 79.7 L124.5 77.3 M79.9 120.8 L94.2 113.9 L103.9 108.8 L114.5 105.3 L126.9 102.2 M91.1 145.3 L102.6 149.2 L109.3 154.1 L117.4 158.0 L122.6 154.4" stroke="#8dff3a" stroke-width="3.1" opacity="0.5" filter="url(#soft)"/>
			<path d="M72.9 74.0 L82.6 72.4 L96.4 76.8 L108.3 79.7 L124.5 77.3 M79.9 120.8 L94.2 113.9 L103.9 108.8 L114.5 105.3 L126.9 102.2 M91.1 145.3 L102.6 149.2 L109.3 154.1 L117.4 158.0 L122.6 154.4" stroke="#9dff4a" stroke-width="0.9"/>
