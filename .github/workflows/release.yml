name: Release

# Runs when a version tag such as v0.1.0 is pushed. The packager fetches the
# libraries listed in .pkgmeta, stamps the version into the .toc, builds the
# zip and attaches it to a GitHub release; then the intro goes on top.
#
# The tag's name decides where the zip goes (the cycle is in the /release skill,
# .claude/skills/release/SKILL.md):
#   v1.5.0-alpha.1  untested: a GitHub pre-release only, never CurseForge
#   v1.5.0-beta.1   played by the author: GitHub pre-release + CurseForge beta file
#   v1.5.0          GitHub release + CurseForge release file
# An alpha stays off CurseForge for two reasons, either one enough: its step is
# never given the CurseForge key, and "-p 0" unsets the project id. Do not
# withhold the key with "cond && '' || secret": '' is false, so that always
# gives the secret (it sent v1.4.0-beta.1 to CurseForge).
# CurseForge needs the CF_API_KEY secret and X-Curse-Project-ID in SoulDex.toc;
# without either that upload is skipped and the rest still runs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the changelog

      # The zip and its CurseForge display name are always
      # SoulDex-v<version>-forever.zip; scripts/build.sh uses the same name.
      # Exactly one of the next two steps runs.
      - name: Package an alpha (GitHub pre-release only, no CurseForge)
        if: contains(github.ref_name, 'alpha')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 0 -n "{package-name}-{project-version}-forever:{package-name}-{project-version}-forever.zip"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # No CF_API_KEY here, on purpose: without it the packager cannot upload.

      # The packager marks a tag with "beta" in its name as a beta file on CurseForge.
      - name: Package a beta or a release (GitHub and CurseForge)
        if: ${{ !contains(github.ref_name, 'alpha') }}
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -n "{package-name}-{project-version}-forever:{package-name}-{project-version}-forever.zip"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # A short, readable intro on top of the changelog (.github/release-intro.md;
      # skipped with a warning if it names another version).
      - name: Add the release intro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-intro.sh "$TAG"
