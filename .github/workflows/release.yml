name: Release

# Runs when a version tag such as v0.1.0 is pushed. The packager fetches the
# libraries listed in .pkgmeta, stamps the version into the .toc, builds the
# zip and attaches it to a GitHub release; then the intro goes on top.
# With the CF_API_KEY secret set and X-Curse-Project-ID in SoulDex.toc, the
# packager uploads the same zip to CurseForge too. A tag with "alpha" or "beta"
# in its name is a test build: it becomes a GitHub pre-release only and is NOT
# sent to CurseForge, so an untested build never reaches players' addon
# managers. Two things keep it off, either one enough: the test-build step is
# never given the CurseForge key, and "-p 0" unsets the project id.
# (v1.4.0-beta.1 did go to CurseForge: a first attempt withheld the key with
# "cond && '' || secret", which always gives the secret, because '' is false.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the changelog

      # The zip and its CurseForge display name are always
      # SoulDex-v<version>-forever.zip; scripts/build.sh uses the same name.
      # Exactly one of the next two steps runs.
      - name: Package a test build (GitHub pre-release only, no CurseForge)
        if: contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 0 -n "{package-name}-{project-version}-forever:{package-name}-{project-version}-forever.zip"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # No CF_API_KEY here, on purpose: without it the packager cannot upload.

      - name: Package a release (GitHub and CurseForge)
        if: ${{ !(contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta')) }}
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -n "{package-name}-{project-version}-forever:{package-name}-{project-version}-forever.zip"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # A short, readable intro on top of the changelog (.github/release-intro.md;
      # skipped with a warning if it names another version).
      - name: Add the release intro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-intro.sh "$TAG"
